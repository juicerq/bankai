name: release windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Released tag to attach the Windows installer to
        required: true

jobs:
  release:
    permissions:
      contents: write

    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: oven-sh/setup-bun@v2

      - name: Provide the local check package
        run: |
          git clone --depth 1 https://github.com/juicerq/agent-setup ../agent-setup
          cd ../agent-setup/check
          bun install
          bun run build

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build and publish
        run: bun run build && bunx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
