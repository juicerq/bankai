name: release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Provide the local check package
        run: |
          git clone --depth 1 https://github.com/juicerq/agent-setup ../agent-setup
          cd ../agent-setup/check
          bun install
          bun run build

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build and publish
        run: bun run build && bunx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
